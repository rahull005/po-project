spring:
  application:
    name: po-application

  config:
    import: "file:../config/dev-application.yml"
    # the above two dots provided because rectified from previous error
    #yaml
    #import: "file:./config/dev-application.yml"
    #
    #./ means the working directory, which your log shows is ...\Pay-Order\PoApplication. But your config file lives at ...\Pay-Order\config\dev-application.yml. So Spring will fail with ConfigDataResourceNotFoundException. Choose one:
    #
    #Option A: set the run configuration's working directory to ...\Pay-Order.
    #Option B: change the import to file:../config/dev-application.yml.

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED}

server:
  port: ${PO_SERVER_PORT}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}

integration:
  flex:
    base-url: ${FLEX_BASE_URL}
    connect-timeout-ms: ${FLEX_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${FLEX_READ_TIMEOUT_MS}

outbox:
  worker:
    fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS}
    stale-lock-minutes: ${OUTBOX_STALE_LOCK_MINUTES}
    batch-size: ${OUTBOX_BATCH_SIZE}

logging:
  pattern:
    console: ${LOG_PATTERN}