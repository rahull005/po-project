spring:
  application:
    name: po-application

  datasource:
    url: jdbc:postgresql://localhost:5432/centralized_po
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

integration:
  flex:
    base-url: http://localhost:8081
    scenario: SUCCESS
    connect-timeout-ms: 3000
    read-timeout-ms: 10000

outbox:
  worker:
    fixed-delay-ms: 2000
    stale-lock-minutes: 5
    batch-size: 10