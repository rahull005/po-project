spring:
  application:
    name: po-application

  config:
    import: "optional:file:./config/dev-application.yml"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

server:
  port: ${PO_SERVER_PORT}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info}

integration:
  flex:
    base-url: ${FLEX_BASE_URL}
    connect-timeout-ms: ${FLEX_CONNECT_TIMEOUT_MS}
    read-timeout-ms: ${FLEX_READ_TIMEOUT_MS}

outbox:
  worker:
    fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS}
    stale-lock-minutes: ${OUTBOX_STALE_LOCK_MINUTES}
    batch-size: ${OUTBOX_BATCH_SIZE}

logging:
  pattern:
    console: ${LOG_PATTERN}

