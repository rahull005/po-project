spring:
  application:
    name: po-application

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/centralized_po}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info

integration:
  flex:
    base-url: ${FLEX_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${FLEX_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${FLEX_READ_TIMEOUT_MS:10000}

outbox:
  worker:
    fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS:2000}
    stale-lock-minutes: ${OUTBOX_STALE_LOCK_MINUTES:5}
    batch-size: ${OUTBOX_BATCH_SIZE:10}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [corrId=%X{correlationId}] %logger{36} - %msg%n"
