spring:
  application:
    name: fake-flex

  config:
    import: "optional:file:./config/dev-application.yml"

server:
  port: ${FLEX_SERVER_PORT}
  shutdown: graceful

spring.lifecycle:
  timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS}

logging:
  pattern:
    console: ${LOG_PATTERN}